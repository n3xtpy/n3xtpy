  <text x="32" y="58" fill="#3fb950" font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace" font-size="13.5"
        clip-path="url(#promptClip)" xml:space="preserve">n3xtpy@github:~$ </text>
  <text x="169.7" y="58" fill="#e6edf3" font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace" font-size="13.5"
        clip-path="url(#cmdClip)">whoami</text>
  <rect x="221.3" y="46.0" width="7" height="15" rx="1" fill="#58a6ff">
      <animate attributeName="opacity" values="0;0;1" keyTimes="0;0.9932;1" dur="1.46s" fill="freeze"/>
      <animate attributeName="opacity" values="1;1;0;0;1" keyTimes="0;0.45;0.5;0.95;1"
               dur="1.15s" begin="1.45s" repeatCount="indefinite"/>
    </rect>

  <!-- Right-hand status, so the top line is balanced rather than left-heavy. -->
  <g>
    <animate attributeName="opacity" values="0;0;1" keyTimes="0;0.8438;1" dur="3.20s" fill="freeze"/>
    <circle cx="680" cy="54" r="3.5" fill="#3fb950"/>
    <text x="828" y="58" fill="#7d8590" font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace" font-size="12"
          text-anchor="end">rebuilt daily by CI</text>
  </g>

  <!-- The answer to `whoami`: name, then what the name does. -->
  <g>
    <animate attributeName="opacity" values="0;0;1" keyTimes="0;0.7660;1" dur="2.35s" fill="freeze"/><animateTransform attributeName="transform" type="translate" values="0 10; 0 10; 0 0" keyTimes="0;0.7660;1" dur="2.35s" fill="freeze" calcMode="spline" keySplines="0 0 1 1; 0.16 1 0.3 1"/>
    <text x="30" y="118" fill="#e6edf3" font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace" font-size="46"
          font-weight="700" letter-spacing="-1.5">n3xtpy</text>
    <text x="32" y="146" fill="#7d8590" font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace" font-size="13.5"
          letter-spacing="0.2">Automation · Python · JavaScript · CI pipelines</text>
  </g>

  <g>
    <animate attributeName="opacity" values="0;0;1" keyTimes="0;0.8438;1" dur="3.20s" fill="freeze"/>
    <line x1="32" y1="162" x2="828" y2="162" stroke="#21262d" stroke-width="1"/>
    <text x="32" y="180" fill="#3fb950" font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace" font-size="13.5">▸</text>
  </g>
  
    <text x="52" y="180" fill="#7d8590" font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace" font-size="13.5"
          opacity="1">building things that build themselves
      <animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0.0000;0.0000;0.0417;0.2917;0.3333;1.0000" dur="10.80s" repeatCount="indefinite"/>
    </text>
    <text x="52" y="180" fill="#7d8590" font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace" font-size="13.5"
          opacity="0">if it runs twice, it should run on a cron
      <animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0.0000;0.3333;0.3750;0.6250;0.6667;1.0000" dur="10.80s" repeatCount="indefinite"/>
    </text>
    <text x="52" y="180" fill="#7d8590" font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace" font-size="13.5"
          opacity="0">this README regenerates itself every day
      <animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0.0000;0.6667;0.7083;0.9583;1.0000;1.0000" dur="10.80s" repeatCount="indefinite"/>
    </text>

  <rect x="0.5" y="0.5" width="859" height="205" rx="14" fill="none" stroke="#21262d" stroke-width="1"/>
