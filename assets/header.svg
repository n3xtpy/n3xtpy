<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 242"
     width="880" height="242" role="img" aria-label="n3xtpy — animated terminal header">
  <title>n3xtpy@github</title>
  <defs>
    <linearGradient id="edge" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0.000" stop-color="#58a6ff"/><stop offset="0.500" stop-color="#bc8cff"/><stop offset="1.000" stop-color="#39d353"/>
      <animateTransform attributeName="gradientTransform" type="translate"
                        values="-1 0; 1 0; -1 0" dur="9s" repeatCount="indefinite"/>
    </linearGradient>
    <filter id="softglow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="3.2" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <pattern id="grid" width="26" height="26" patternUnits="userSpaceOnUse">
      <path d="M 26 0 L 0 0 0 26" fill="none" stroke="#30363d"
            stroke-width="0.6" opacity="0.3"/>
    </pattern>
    <pattern id="scan" width="880" height="3" patternUnits="userSpaceOnUse">
      <rect x="0" y="0" width="880" height="1" fill="#ffffff" opacity="0.05"/>
    </pattern>
    <clipPath id="scan-clip">
      <rect x="0" y="0" width="880" height="242" rx="12"/>
    </clipPath>
    <radialGradient id="vignette" cx="0.5" cy="0.1" r="0.9">
      <stop offset="0%" stop-color="#58a6ff" stop-opacity="0.16"/>
      <stop offset="60%" stop-color="#bc8cff" stop-opacity="0.05"/>
      <stop offset="100%" stop-color="#0d1117" stop-opacity="0"/>
    </radialGradient>

    <!-- Sweeps across the name once it has landed, like a CRT refresh. -->
    <linearGradient id="nameFill" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#58a6ff"/>
      <stop offset="45%" stop-color="#56d4dd"/>
      <stop offset="100%" stop-color="#bc8cff"/>
      <animateTransform attributeName="gradientTransform" type="translate"
                        values="-0.6 0; 0.6 0; -0.6 0" dur="7s" repeatCount="indefinite"/>
    </linearGradient>

    <clipPath id="promptClip">
      <rect x="34.0" y="81.0" width="0" height="22.0">
        <animate attributeName="width" from="0" to="153.3"
                 begin="0.20s" dur="0.77s" fill="freeze" calcMode="linear"/>
      </rect>
    </clipPath>
    <clipPath id="cmdClip">
      <rect x="187.3" y="81.0" width="0" height="22.0">
        <animate attributeName="width" from="0" to="58.1"
                 begin="0.92s" dur="0.45s" fill="freeze" calcMode="linear"/>
      </rect>
    </clipPath>
  </defs>

  <rect x="0.5" y="0.5" width="879" height="241" rx="14" fill="#0d1117"/>
  <rect x="0.5" y="0.5" width="879" height="241" rx="14" fill="url(#grid)"/>
  <rect x="0.5" y="0.5" width="879" height="241" rx="14" fill="url(#vignette)"/>

  <rect x="0" y="0" width="880" height="36" rx="12" fill="#161b22"/>
  <rect x="0" y="24" width="880" height="12" fill="#161b22"/>
  <line x1="0" y1="36" x2="880" y2="36" stroke="#30363d" stroke-width="1"/>
  <circle cx="22" cy="18.0" r="6" fill="#ff5f56"/>
  <circle cx="42" cy="18.0" r="6" fill="#ffbd2e"/>
  <circle cx="62" cy="18.0" r="6" fill="#27c93f"/>
  <text x="440.0" y="22.0" fill="#8b949e" font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace"
        font-size="12" text-anchor="middle">bash — 80×24</text>

  <text x="34" y="96" fill="#39d353" font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace" font-size="15"
        clip-path="url(#promptClip)" xml:space="preserve">n3xtpy@github:~$ </text>
  <text x="187.34" y="96" fill="#c9d1d9" font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace" font-size="15"
        clip-path="url(#cmdClip)">whoami</text>

  <!-- The answer to `whoami`: rises into place, then breathes. -->
  <g opacity="0" filter="url(#softglow)">
    <animate attributeName="opacity" values="0;1" begin="1.81s" dur="0.5s" fill="freeze"/>
    <animateTransform attributeName="transform" type="translate" values="0 14; 0 0"
                      begin="1.81s" dur="0.6s" fill="freeze" calcMode="spline"
                      keySplines="0.16 1 0.3 1"/>
    <text x="34" y="158" fill="url(#nameFill)" font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace"
          font-size="52" font-weight="700" letter-spacing="1.5">n3xtpy</text>
  </g>

  
    <text x="36" y="190" fill="#8b949e" font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace" font-size="14" opacity="0">
      <tspan fill="#39d353">▸ </tspan>building things that build themselves
      <animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0.0000;0.0000;0.0312;0.2188;0.2500;1.0000" dur="12.80s" repeatCount="indefinite"/>
    </text>
    <text x="36" y="190" fill="#8b949e" font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace" font-size="14" opacity="0">
      <tspan fill="#39d353">▸ </tspan>python · javascript · automation
      <animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0.0000;0.2500;0.2812;0.4688;0.5000;1.0000" dur="12.80s" repeatCount="indefinite"/>
    </text>
    <text x="36" y="190" fill="#8b949e" font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace" font-size="14" opacity="0">
      <tspan fill="#39d353">▸ </tspan>this README regenerates itself every day
      <animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0.0000;0.5000;0.5312;0.7188;0.7500;1.0000" dur="12.80s" repeatCount="indefinite"/>
    </text>
    <text x="36" y="190" fill="#8b949e" font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace" font-size="14" opacity="0">
      <tspan fill="#39d353">▸ </tspan>if it runs twice, it should run on a cron
      <animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0.0000;0.7500;0.7813;0.9688;1.0000;1.0000" dur="12.80s" repeatCount="indefinite"/>
    </text>

  <rect x="244.5" y="83.0" width="8" height="15" fill="#c9d1d9" opacity="0">
      <animate attributeName="opacity" values="0;1" begin="1.36s" dur="0.01s" fill="freeze"/>
      <animate attributeName="opacity" values="1;1;0;0;1" keyTimes="0;0.45;0.5;0.95;1"
               dur="1.1s" begin="1.36s" repeatCount="indefinite"/>
    </rect>

  <!-- A rect, not a line: a zero-height bbox gives an objectBoundingBox
       gradient nothing to resolve against, and the stroke renders as nothing. -->
  <g opacity="0">
    <animate attributeName="opacity" values="0;1" begin="2.92s" dur="0.6s" fill="freeze"/>
    <rect x="34" y="208" width="812" height="1.5" rx="0.75" fill="url(#edge)"/>
  </g>

  <rect x="0.5" y="0.5" width="879" height="241" rx="14"
        fill="none" stroke="url(#edge)" stroke-width="1.5" opacity="0.9"/>
  <g clip-path="url(#scan-clip)" pointer-events="none">
    <rect x="0" y="-3" width="880" height="248" fill="url(#scan)">
      <animateTransform attributeName="transform" type="translate"
                        values="0 0; 0 3" dur="1.6s" repeatCount="indefinite"/>
    </rect>
  </g>
</svg>
