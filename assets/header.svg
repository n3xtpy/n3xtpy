<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 206"
     width="860" height="206" role="img" aria-label="n3xtpy — profile banner">
  <title>n3xtpy — Automation · Python · JavaScript · CI pipelines</title>
  <defs>
    <linearGradient id="card-wash" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#161b22"/>
      <stop offset="55%" stop-color="#111720"/>
      <stop offset="100%" stop-color="#0d1117"/>
    </linearGradient>
    <linearGradient id="card-rule" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#58a6ff" stop-opacity="0"/>
      <stop offset="18%" stop-color="#58a6ff" stop-opacity="0.85"/>
      <stop offset="62%" stop-color="#58a6ff" stop-opacity="0.20"/>
      <stop offset="100%" stop-color="#58a6ff" stop-opacity="0"/>
    </linearGradient>
    <clipPath id="card-clip">
      <rect x="0" y="0" width="860" height="206" rx="14"/>
    </clipPath>
    <clipPath id="promptClip">
      <rect x="32.0" y="45.0" width="139.7" height="20.0">
        <animate attributeName="width" values="0;0;139.7" keyTimes="0;0.2273;1"
                 dur="0.88s" fill="freeze" calcMode="linear"/>
      </rect>
    </clipPath>
    <clipPath id="cmdClip">
      <rect x="169.7" y="45.0" width="52.6" height="20.0">
        <animate attributeName="width" values="0;0;52.6" keyTimes="0;0.7103;1"
                 dur="1.45s" fill="freeze" calcMode="linear"/>
      </rect>
    </clipPath>
    <linearGradient id="dotFade" x1="1" y1="0" x2="0" y2="0">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.30"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <mask id="dotMask">
      <rect x="0" y="0" width="860" height="206" fill="url(#dotFade)"/>
    </mask>
  </defs>

  <rect x="0" y="0" width="860" height="206" rx="14" fill="url(#card-wash)"/>
  <g clip-path="url(#card-clip)">
    <rect x="0" y="0" width="860" height="2" fill="url(#card-rule)"/>
  </g>

