<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 188"
     width="860" height="188" role="img" aria-label="language breakdown by bytes of source">
  <title>Language breakdown by bytes of source across public repositories</title>
  <defs>
    <linearGradient id="card-wash" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#161b22"/>
      <stop offset="55%" stop-color="#111720"/>
      <stop offset="100%" stop-color="#0d1117"/>
    </linearGradient>
    <linearGradient id="card-rule" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#a371f7" stop-opacity="0"/>
      <stop offset="18%" stop-color="#a371f7" stop-opacity="0.85"/>
      <stop offset="62%" stop-color="#a371f7" stop-opacity="0.20"/>
      <stop offset="100%" stop-color="#a371f7" stop-opacity="0"/>
    </linearGradient>
    <clipPath id="card-clip">
      <rect x="0" y="0" width="860" height="188" rx="14"/>
    </clipPath>
    <linearGradient id="barSheen" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0"/>
      <stop offset="50%" stop-color="#ffffff" stop-opacity="0.07"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <clipPath id="barSheen-clip">
      <rect x="32" y="82" width="796" height="20"/>
    </clipPath>
    <clipPath id="barClip">
      <rect x="32" y="82" width="796" height="20" rx="10.0"/>
    </clipPath>
  </defs>

  <rect x="0" y="0" width="860" height="188" rx="14" fill="url(#card-wash)"/>
  <g clip-path="url(#card-clip)">
    <rect x="0" y="0" width="860" height="2" fill="url(#card-rule)"/>
  </g>
  <circle cx="36" cy="33" r="4" fill="#a371f7"/>
  <text x="50" y="38" fill="#e6edf3" font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace" font-size="13" font-weight="700" letter-spacing="1.6">STACK</text>
  <text x="828" y="38" fill="#7d8590" font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace" font-size="12" text-anchor="end">bytes of source · public repos</text>
  <line x1="32" y1="54" x2="828" y2="54" stroke="#21262d" stroke-width="1"/>

  <rect x="32" y="82" width="796" height="20" rx="10.0" fill="#21262d" opacity="0.5">
    <animate attributeName="opacity" values="0;0;0.5" keyTimes="0;0.2727;1" dur="0.55s" fill="freeze"/>
  </rect>
  <g clip-path="url(#barClip)">
    
    <rect x="32.00" y="82" width="711.62" height="20" fill="#3776ab">
      <title>Python — 89.4%</title>
      <animate attributeName="width" values="0;0;711.62" keyTimes="0;0.2800;1" dur="1.25s" fill="freeze" calcMode="spline" keySplines="0 0 1 1; 0.16 1 0.3 1"/>
    </rect>
    <rect x="743.62" y="82" width="84.38" height="20" fill="#f1e05a">
      <title>JavaScript — 10.6%</title>
      <animate attributeName="width" values="0;0;84.38" keyTimes="0;0.3525;1" dur="1.39s" fill="freeze" calcMode="spline" keySplines="0 0 1 1; 0.16 1 0.3 1"/>
    </rect>
  </g>
  <g clip-path="url(#barSheen-clip)" pointer-events="none">
    <rect x="-111.28" y="82" width="143.28" height="20" fill="url(#barSheen)">
      <animateTransform attributeName="transform" type="translate"
                        values="0 0; 1083 0" dur="5.5s"
                        begin="1.53s" repeatCount="indefinite"/>
    </rect>
  </g>

  
    <g>
      <animate attributeName="opacity" values="0;0;1" keyTimes="0;0.6250;1" dur="1.20s" fill="freeze"/>
      <rect x="32.0" y="139" width="10" height="10" rx="2.5" fill="#3776ab"/>
      <text x="52.0" y="148" font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace" font-size="13" fill="#e6edf3">Python</text>
      <text x="402.0" y="148" font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace" font-size="12.5" fill="#7d8590"
            text-anchor="end">89.4%</text>
      <line x1="104.8" y1="144"
            x2="358.5" y2="144"
            stroke="#21262d" stroke-width="1"/>
    </g>
    <g>
      <animate attributeName="opacity" values="0;0;1" keyTimes="0;0.6642;1" dur="1.34s" fill="freeze"/>
      <rect x="430.0" y="139" width="10" height="10" rx="2.5" fill="#f1e05a"/>
      <text x="450.0" y="148" font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace" font-size="13" fill="#e6edf3">JavaScript</text>
      <text x="800.0" y="148" font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace" font-size="12.5" fill="#7d8590"
            text-anchor="end">10.6%</text>
      <line x1="534.0" y1="144"
            x2="756.5" y2="144"
            stroke="#21262d" stroke-width="1"/>
    </g>

  <rect x="0.5" y="0.5" width="859" height="187" rx="14" fill="none" stroke="#21262d" stroke-width="1"/>
</svg>
