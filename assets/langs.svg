<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 162"
     width="880" height="162" role="img" aria-label="language breakdown by bytes of source">
  <title>Language breakdown by bytes of source across public repositories</title>
  <defs>
    <linearGradient id="edge" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0.000" stop-color="#bc8cff"/><stop offset="0.500" stop-color="#58a6ff"/><stop offset="1.000" stop-color="#39d353"/>
      <animateTransform attributeName="gradientTransform" type="translate"
                        values="-1 0; 1 0; -1 0" dur="9s" repeatCount="indefinite"/>
    </linearGradient>
    <linearGradient id="sheen" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0"/>
      <stop offset="50%" stop-color="#ffffff" stop-opacity="0.22"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <clipPath id="barClip">
      <rect x="26" y="74" width="828" height="20" rx="10.0"/>
    </clipPath>
  </defs>

  <rect x="0.5" y="0.5" width="879" height="161" rx="12" fill="#0d1117"/>
  <rect x="0" y="0" width="880" height="36" rx="12" fill="#161b22"/>
  <rect x="0" y="24" width="880" height="12" fill="#161b22"/>
  <line x1="0" y1="36" x2="880" y2="36" stroke="#30363d" stroke-width="1"/>
  <circle cx="22" cy="18.0" r="6" fill="#ff5f56"/>
  <circle cx="42" cy="18.0" r="6" fill="#ffbd2e"/>
  <circle cx="62" cy="18.0" r="6" fill="#27c93f"/>
  <text x="440.0" y="22.0" fill="#8b949e" font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace"
        font-size="12" text-anchor="middle">~/stack $ cloc --by-lang</text>

  <rect x="26" y="74" width="828" height="20" rx="10.0" fill="#30363d" opacity="0">
    <animate attributeName="opacity" values="0;0.45" begin="0.15s" dur="0.4s" fill="freeze"/>
  </rect>
  <g clip-path="url(#barClip)">
    
    <rect x="26.00" y="74" width="0" height="20" fill="#3776ab">
      <title>Python — 89.4%</title>
      <animate attributeName="width" from="0" to="740.07" begin="0.35s"
               dur="0.9s" fill="freeze" calcMode="spline" keySplines="0.16 1 0.3 1"/>
    </rect>
    <rect x="766.07" y="74" width="0" height="20" fill="#f1e05a">
      <title>JavaScript — 10.6%</title>
      <animate attributeName="width" from="0" to="87.93" begin="0.51s"
               dur="0.9s" fill="freeze" calcMode="spline" keySplines="0.16 1 0.3 1"/>
    </rect>
    <rect x="-140" y="74" width="140" height="20" fill="url(#sheen)" pointer-events="none">
      <animateTransform attributeName="transform" type="translate"
                        values="0 0; 1040 0" dur="4.5s"
                        begin="1.57s" repeatCount="indefinite"/>
    </rect>
  </g>

  
    <g opacity="0">
      <animate attributeName="opacity" values="0;1" begin="0.80s" dur="0.45s" fill="freeze"/>
      <circle cx="32.0" cy="128" r="5" fill="#3776ab"/>
      <text x="44.0" y="132" font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace" font-size="12.5" fill="#c9d1d9">Python</text>
      <text x="96.5" y="132" font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace" font-size="12.5" fill="#8b949e">89.4%</text>
    </g>
    <g opacity="0">
      <animate attributeName="opacity" values="0;1" begin="0.96s" dur="0.45s" fill="freeze"/>
      <circle cx="174.0" cy="128" r="5" fill="#f1e05a"/>
      <text x="186.0" y="132" font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace" font-size="12.5" fill="#c9d1d9">JavaScript</text>
      <text x="268.5" y="132" font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace" font-size="12.5" fill="#8b949e">10.6%</text>
    </g>

  <rect x="0.5" y="0.5" width="879" height="161" rx="12"
        fill="none" stroke="url(#edge)" stroke-width="1.5" opacity="0.9"/>
</svg>
