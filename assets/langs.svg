<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 150"
     width="880" height="150" role="img" aria-label="language breakdown pending first run">
  <title>Language breakdown — awaiting the first scheduled run</title>
  <defs><linearGradient id="edge" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0.000" stop-color="#bc8cff"/><stop offset="0.500" stop-color="#58a6ff"/><stop offset="1.000" stop-color="#39d353"/>
      <animateTransform attributeName="gradientTransform" type="translate"
                        values="-1 0; 1 0; -1 0" dur="9s" repeatCount="indefinite"/>
    </linearGradient></defs>
  <rect x="0.5" y="0.5" width="879" height="149" rx="12" fill="#0d1117"/>
  <rect x="0" y="0" width="880" height="36" rx="12" fill="#161b22"/>
  <rect x="0" y="24" width="880" height="12" fill="#161b22"/>
  <line x1="0" y1="36" x2="880" y2="36" stroke="#30363d" stroke-width="1"/>
  <circle cx="22" cy="18.0" r="6" fill="#ff5f56"/>
  <circle cx="42" cy="18.0" r="6" fill="#ffbd2e"/>
  <circle cx="62" cy="18.0" r="6" fill="#27c93f"/>
  <text x="440.0" y="22.0" fill="#8b949e" font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace"
        font-size="12" text-anchor="middle">~/stack $ cloc --by-lang</text>
  <text x="26" y="82" font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace" font-size="13" fill="#8b949e">
    awaiting first scheduled run
  </text>
  <rect x="26" y="100" width="9" height="15" fill="#c9d1d9">
    <animate attributeName="opacity" values="1;1;0;0;1" keyTimes="0;0.45;0.5;0.95;1"
             dur="1.1s" repeatCount="indefinite"/>
  </rect>
  <rect x="0.5" y="0.5" width="879" height="149" rx="12"
        fill="none" stroke="url(#edge)" stroke-width="1.5" opacity="0.9"/>
</svg>
