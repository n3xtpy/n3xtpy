name: Update profile art

on:
  schedule:
    - cron: "17 4 * * *"  # daily, 04:17 UTC
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  regenerate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install -r requirements.txt

      - run: python scripts/generate_neofetch.py ${{ github.repository_owner }}
      - run: python scripts/generate_heatmap.py ${{ github.repository_owner }}

      - name: Commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add assets/neofetch-card.svg assets/heatmap.svg
          git diff --cached --quiet || git commit -m "chore: refresh profile art [skip ci]"
          git push
