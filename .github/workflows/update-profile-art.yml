name: Update profile art

# Dormant. The README is plain text now, so nothing renders assets/*.svg and a
# daily run would only commit churn to main. The generators are kept, and this
# job still runs on demand, so the cards can be brought back by restoring the
# schedule below and putting the <img> tags back in README.md.
#
#  schedule:
#    - cron: "17 4 * * *"  # daily, 04:17 UTC

on:
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: profile-art
  cancel-in-progress: true

jobs:
  regenerate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      # Each generator leaves its asset untouched and exits 0 if its data
      # source is unreachable, so a rate-limited run is a no-op, not a blank
      # card. That also means a genuine crash still fails the job.
      - run: python scripts/generate_header.py   "${{ github.repository_owner }}"
      - run: python scripts/generate_neofetch.py "${{ github.repository_owner }}"
      - run: python scripts/generate_heatmap.py  "${{ github.repository_owner }}"
      - run: python scripts/generate_langs.py    "${{ github.repository_owner }}"

      - name: Commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add assets/header.svg assets/neofetch-card.svg assets/heatmap.svg assets/langs.svg
          git diff --cached --quiet || git commit -m "chore: refresh profile art [skip ci]"
          git push
